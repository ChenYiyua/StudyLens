name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/dashboard/package-lock.json
            frontend/extension/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Test course indexer
        run: |
          pip install -r tools/requirements.txt
          python -m unittest tools.test_build_course_index
      - name: Restore backend
        run: dotnet restore StudyLens.sln
      - name: Test backend
        run: dotnet test StudyLens.sln --configuration Release --no-restore
      - name: Verify backend formatting
        run: dotnet format StudyLens.sln --verify-no-changes --no-restore
      - name: Build dashboard
        working-directory: frontend/dashboard
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build browser extension
        working-directory: frontend/extension
        run: |
          npm ci
          npm run lint
          npm run build
