name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      RUN_MONGODB_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/dashboard/package-lock.json
            frontend/extension/package-lock.json
      - name: Restore backend
        run: dotnet restore StudyLens.sln
      - name: Test backend and MongoDB adapter
        run: dotnet test StudyLens.sln --configuration Release --no-restore
      - name: Verify backend formatting
        run: dotnet format StudyLens.sln --verify-no-changes --no-restore
      - name: Build dashboard
        working-directory: frontend/dashboard
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build extension
        working-directory: frontend/extension
        run: |
          npm ci
          npm run lint
          npm run build
